<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Dark Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#021a14" stop-opacity="1"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf Vein Gradient -->
    <linearGradient id="leafGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Optical Camera Lens Aperture Rings -->
  <circle cx="32" cy="32" r="23" stroke="#064e3b" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="21" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="18" stroke="#047857" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Ambient Light Reflection inside Lens -->
  <circle cx="32" cy="32" r="16" fill="url(#coreGlow)"/>
  <path d="M22 22 A15 15 0 0 1 42 22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Organic NutriLeaf (Nutrition + Optical Focus) -->
  <g filter="url(#glow)">
    <!-- Leaf Body Silhouette -->
    <path d="M32 15 C39 21, 42 29, 32 46 C22 29, 25 21, 32 15 Z" 
          fill="url(#leafGrad)" 
          fill-opacity="0.25"
          stroke="url(#leafGrad)" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Central Leaf Vein -->
    <path d="M32 17 L32 45" 
          stroke="#a7f3d0" 
          stroke-width="2" 
          stroke-linecap="round"/>

    <!-- Angular Vein Branches (Metabolic Energy) -->
    <path d="M32 25 Q35 23 38 22" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 25 Q29 23 26 22" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 31 Q36 29 39 29" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 31 Q28 29 25 29" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 37 Q35 36 38 37" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M32 37 Q29 36 26 37" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Glowing Focus Points (Lens Target Crosshairs) -->
  <circle cx="32" cy="11" r="1.5" fill="#34d399"/>
  <circle cx="32" cy="53" r="1.5" fill="#34d399"/>
  <circle cx="11" cy="32" r="1.5" fill="#06b6d4"/>
  <circle cx="53" cy="32" r="1.5" fill="#06b6d4"/>
</svg>
